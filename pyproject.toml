[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ap3-qubo"
version = "0.1.0"
description = "AP³-QUBO: Adaptive Preference-Penalty Pareto QUBO Framework for High-Entropy Alloy Composition Optimization via CIM Optical Quantum Computing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ZHUOYE (At3ase)"}
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "kaiwu>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# 方案 H-04 必需实验对照组（NSGA-II 基线，实验 3）：
# deap 不是可选开发工具，而是跑对比实验的硬依赖——
# 缺失时 nsga2_baseline 显式抛 ImportError（P0-6 修复）。
experiments = [
    "deap>=1.4",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
calphad = [
    "pycalphad>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
